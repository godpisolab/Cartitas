services:
  postgres:
    image: postgres:16
    container_name: cartitas-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: cartitas
      POSTGRES_USER: cartitas
      POSTGRES_PASSWORD: cartitas
    ports:
      # 5433 en el host, no 5432: el 5432 ya está ocupado por un Postgres del
      # sistema ajeno a este proyecto -- no lo tocamos.
      - "5433:5432"
    volumes:
      - cartitas_pgdata:/var/lib/postgresql/data
      # Postgres ejecuta automáticamente cualquier *.sql de este directorio la
      # PRIMERA vez que crea el volumen de datos -- si cambias el esquema y
      # quieres que se reaplique desde cero, hay que borrar el volumen
      # (`docker compose down -v`), no basta con reiniciar el contenedor.
      - ./schema-postgresql-app-tcg.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cartitas -d cartitas"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  cartitas_pgdata:
