name: Tests

# Corre en cada push y en cada pull request contra cualquier rama -- sin
# filtro de rutas a propósito: requirements-dev.txt, el esquema SQL y el
# seed viven fuera de store_monitor/tests/, y un filtro mal ajustado es la
# forma más común de que "CI en verde" deje de significar algo sin que
# nadie se entere.
#
# Los dos jobs delegan en run_tests.py (raíz del repo) -- el mismo script
# que se usa en local -- para instalar dependencias, comprobar/preparar
# Postgres y correr pytest. Mismo comportamiento en los dos sitios a
# propósito: "pasa en mi máquina" y "pasa en CI" deben significar lo mismo.
"on":
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    # Postgres real como servicio del job -- en local, sin Docker, esos
    # tests se saltan con gracia (ver tests/conftest.py); en CI no debe
    # pasar nunca: `--fail-on-skipped` (más abajo) hace fallar el job si
    # algún test queda SKIPPED, en vez de dejar pasar un run silenciosamente
    # incompleto.
    #
    # POSTGRES_DB ya se llama cartitas_test -- run_tests.py detecta que ya
    # existe (vía la base administrativa "postgres") y solo reaplica el
    # esquema/seed encima, sin necesitar un paso `CREATE DATABASE` aparte.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: cartitas
          POSTGRES_PASSWORD: cartitas
          POSTGRES_DB: cartitas_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U cartitas -d cartitas_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            store_monitor/requirements.txt
            store_monitor/requirements-dev.txt

      # run_tests.py --only store_monitor hace, en este orden: instala
      # shared + store_monitor/requirements-dev.txt; comprueba que Postgres
      # responda (el healthcheck de arriba ya lo garantiza, así que no
      # levanta nada por su cuenta); reaplica schema+seed sobre
      # cartitas_test desde cero; corre pytest con los flags de cobertura,
      # y falla si queda algún SKIPPED (--fail-on-skipped).
      - name: Ejecutar la suite completa
        shell: bash
        run: |
          python run_tests.py --only store_monitor --fail-on-skipped \
            -- -v -rs --cov --cov-report=term-missing --cov-report=xml

      - name: Subir informe de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: store_monitor/coverage.xml

  test-api:
    runs-on: ubuntu-latest

    # Job separado del scraper a propósito -- api/ tiene su propio
    # requirements.txt (fastapi/sqlmodel, sin cloudscraper/pybreaker/
    # apscheduler) y su propio ciclo de vida, ver
    # docs/estandares-implementacion-api.md sección 1. Comparte la MISMA
    # cartitas_test que el scraper (mismo esquema, en un Postgres de
    # servicio propio de este job, no compartido con el otro), pero no
    # tiene sentido instalar las dependencias del otro servicio para correr
    # esto -- run_tests.py --only api ya no lo hace.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: cartitas
          POSTGRES_PASSWORD: cartitas
          POSTGRES_DB: cartitas_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U cartitas -d cartitas_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            api/requirements.txt
            api/requirements-dev.txt

      - name: Ejecutar la suite completa
        shell: bash
        run: |
          python run_tests.py --only api --fail-on-skipped \
            -- -v -rs --cov --cov-report=term-missing --cov-report=xml

      - name: Subir informe de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report-api
          path: api/coverage.xml
