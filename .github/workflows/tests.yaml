name: Tests

# Corre en cada push y en cada pull request contra cualquier rama -- sin
# filtro de rutas a propósito: requirements-dev.txt, el esquema SQL y el
# seed viven fuera de store_monitor/tests/, y un filtro mal ajustado es la
# forma más común de que "CI en verde" deje de significar algo sin que
# nadie se entere.
"on":
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    # Postgres real como servicio del job -- en local, sin Docker, 40 de los
    # 269 tests se saltan con gracia (ver tests/conftest.py); en CI no debe
    # pasar nunca: si el servicio no arranca, el job falla en el healthcheck,
    # no deja pasar un run silenciosamente incompleto.
    #
    # POSTGRES_DB ya se llama cartitas_test -- coincide con el nombre que
    # tests/conftest.py espera por defecto (ver TEST_DATABASE_URL), así que
    # no hace falta un paso aparte de "CREATE DATABASE".
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: cartitas
          POSTGRES_PASSWORD: cartitas
          POSTGRES_DB: cartitas_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U cartitas -d cartitas_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            store_monitor/requirements.txt
            store_monitor/requirements-dev.txt

      - name: Instalar dependencias
        run: |
          pip install -r store_monitor/requirements.txt
          pip install -r store_monitor/requirements-dev.txt

      # Mismo procedimiento que describe el docstring de tests/conftest.py
      # para levantarlo a mano en local -- aquí automatizado. El healthcheck
      # de arriba ya garantiza que Postgres acepta conexiones antes de este
      # paso, así que no hace falta sleep/retry adicional.
      - name: Aplicar esquema y seed a cartitas_test
        env:
          PGPASSWORD: cartitas
        run: |
          psql -h localhost -p 5433 -U cartitas -d cartitas_test -v ON_ERROR_STOP=1 -f schema-postgresql-app-tcg.sql
          psql -h localhost -p 5433 -U cartitas -d cartitas_test -v ON_ERROR_STOP=1 -f seed-catalog-app-tcg.sql

      # Una sola ejecución de pytest. Se comprueba primero el código de
      # salida REAL de pytest (a través de la tubería con `pipefail`, para
      # que un fallo de test no quede enmascarado por el exit code de
      # `tee`) y solo si los tests pasaron se comprueba que no haya ningún
      # SKIPPED -- en CI, con Postgres siempre disponible, un test saltado
      # significa que el entorno no se montó bien (p.ej. el seed no se
      # aplicó), no que falte una dependencia opcional como en local.
      - name: Ejecutar la suite completa
        env:
          TEST_DATABASE_URL: postgresql://cartitas:cartitas@localhost:5433/cartitas_test
        working-directory: store_monitor
        shell: bash
        run: |
          set -o pipefail
          python -m pytest -v -rs --cov --cov-report=term-missing --cov-report=xml \
            | tee /tmp/pytest_output.txt
          test_status=$?

          if [ "$test_status" -ne 0 ]; then
            exit "$test_status"
          fi

          if grep -q "^SKIPPED" /tmp/pytest_output.txt; then
            echo "::error::Hay tests SKIPPED en CI -- el servicio de Postgres debería estar siempre disponible aquí. Revisa el paso 'Aplicar esquema y seed'."
            grep "^SKIPPED" /tmp/pytest_output.txt
            exit 1
          fi

      - name: Subir informe de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: store_monitor/coverage.xml